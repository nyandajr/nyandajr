<svg viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg" width="100%" height="32" preserveAspectRatio="none">
  <defs>
    <linearGradient id="trackFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1f4d73" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fd3ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00bfff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="0" y1="16" x2="1200" y2="16" stroke="url(#trackFade)" stroke-width="1.5"/>

  <circle cy="16" r="8" fill="url(#pulseGlow)">
    <animate attributeName="cx" values="-40;1240;-40" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="16" r="2.5" fill="#e8f6ff">
    <animate attributeName="cx" values="-40;1240;-40" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cy="16" r="6" fill="url(#pulseGlow)" opacity="0.6">
    <animate attributeName="cx" values="-40;1240;-40" dur="6s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle cy="16" r="2" fill="#e8f6ff" opacity="0.7">
    <animate attributeName="cx" values="-40;1240;-40" dur="6s" begin="-3s" repeatCount="indefinite"/>
  </circle>
</svg>
