name: profile-metrics

# Self-hosted, not a third-party Vercel widget -- the previous graph broke
# because that free hosting service hit its own billing cap (HTTP 402),
# with nothing on this end to fix. This workflow generates the same kind
# of visual and commits it straight into the repo, so it can't go down
# because someone else's free tier ran out.

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nyandajr
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: Africa/Dar_es_Salaam
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
