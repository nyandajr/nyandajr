<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" width="1200" height="280">
  <defs>
    <!-- Deep navy gradient — readable on both GitHub themes -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c1b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#050b18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter for circuit nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" rx="6"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.06" stroke="#00BFFF" stroke-width="0.5">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
    <line x1="1100" y1="0" x2="1100" y2="280"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="56" x2="1200" y2="56"/>
    <line x1="0" y1="112" x2="1200" y2="112"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="224" x2="1200" y2="224"/>
  </g>

  <!-- ═══ CIRCUIT TRACES ═══ -->
  <g stroke="#00BFFF" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- Left traces from SQL -->
    <polyline points="200,110 160,110 160,140 80,140"/>
    <polyline points="200,130 170,130 170,200 80,200"/>
    <!-- Left traces from PYTHON -->
    <polyline points="230,165 200,165 200,200 80,200"/>
    <!-- Left traces from PYSPARK -->
    <polyline points="220,215 180,215 180,240 80,240"/>
    <!-- Right traces to FASTAPI -->
    <polyline points="560,95 620,95 620,70 730,70"/>
    <!-- Right traces to AZURE -->
    <polyline points="560,105 640,105 640,50 870,50"/>
    <!-- Right traces to DOCKER -->
    <polyline points="560,150 650,150 650,190 870,190"/>
    <!-- Right traces to LIGHTGBM -->
    <polyline points="560,170 630,170 630,230 730,230"/>
    <!-- Center chip top/bottom pins -->
    <line x1="370" y1="60" x2="370" y2="20"/>
    <line x1="410" y1="60" x2="410" y2="20"/>
    <line x1="450" y1="60" x2="450" y2="20"/>
    <line x1="490" y1="60" x2="490" y2="20"/>
    <line x1="370" y1="220" x2="370" y2="260"/>
    <line x1="410" y1="220" x2="410" y2="260"/>
    <line x1="450" y1="220" x2="450" y2="260"/>
    <line x1="490" y1="220" x2="490" y2="260"/>
  </g>

  <!-- ═══ INPUT MODULE BOXES ═══ -->
  <!-- SQL -->
  <g filter="url(#glow)">
    <rect x="20" y="95" width="80" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="60" y="115" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="11" fill="#00BFFF" text-anchor="middle" letter-spacing="2">SQL</text>
  </g>
  <!-- PYTHON -->
  <g filter="url(#glow)">
    <rect x="20" y="150" width="80" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="60" y="170" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="11" fill="#00BFFF" text-anchor="middle" letter-spacing="2">PYTHON</text>
  </g>
  <!-- PYSPARK -->
  <g filter="url(#glow)">
    <rect x="20" y="205" width="80" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="60" y="225" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#00BFFF" text-anchor="middle" letter-spacing="1">PYSPARK</text>
  </g>

  <!-- ═══ CENTRE CHIP (MLOps) ═══ -->
  <g filter="url(#glow-strong)">
    <rect x="340" y="60" width="220" height="160" rx="5" fill="#020c1b" stroke="#00BFFF" stroke-width="2.5"/>
    <!-- Chip inner border -->
    <rect x="350" y="70" width="200" height="140" rx="3" fill="none" stroke="#00BFFF" stroke-width="0.6" opacity="0.4"/>
    <!-- Main label -->
    <text x="450" y="128" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="20" fill="#00BFFF" text-anchor="middle" letter-spacing="3" font-weight="bold">MLOps</text>
    <!-- Sub label -->
    <text x="450" y="150" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="8.5" fill="#4da6ff" text-anchor="middle" letter-spacing="2" opacity="0.85">CI/CD · AZURE · PIPELINES</text>
    <!-- Chip pin indicators top -->
    <rect x="368" y="63" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="408" y="63" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="448" y="63" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="488" y="63" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <!-- Chip pin indicators bottom -->
    <rect x="368" y="213" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="408" y="213" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="448" y="213" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
    <rect x="488" y="213" width="8" height="4" rx="1" fill="#00BFFF" opacity="0.7"/>
  </g>

  <!-- ═══ OUTPUT MODULE BOXES ═══ -->
  <!-- FASTAPI -->
  <g filter="url(#glow)">
    <rect x="860" y="55" width="90" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="905" y="75" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#00BFFF" text-anchor="middle" letter-spacing="1.5">FASTAPI</text>
  </g>
  <!-- AZURE -->
  <g filter="url(#glow)">
    <rect x="860" y="35" width="90" height="25" rx="3" fill="#050b18" stroke="#4da6ff" stroke-width="1.2"/>
    <text x="905" y="52" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#4da6ff" text-anchor="middle" letter-spacing="2">AZURE</text>
  </g>
  <!-- DOCKER -->
  <g filter="url(#glow)">
    <rect x="860" y="175" width="90" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="905" y="195" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#00BFFF" text-anchor="middle" letter-spacing="1.5">DOCKER</text>
  </g>
  <!-- LIGHTGBM -->
  <g filter="url(#glow)">
    <rect x="730" y="218" width="100" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="780" y="238" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#00BFFF" text-anchor="middle" letter-spacing="1">LIGHTGBM</text>
  </g>
  <!-- XGBOOST -->
  <g filter="url(#glow)">
    <rect x="860" y="120" width="90" height="30" rx="3" fill="#050b18" stroke="#00BFFF" stroke-width="1.2"/>
    <text x="905" y="140" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#00BFFF" text-anchor="middle" letter-spacing="1.5">XGBOOST</text>
  </g>

  <!-- ═══ CIRCUIT NODE DOTS ═══ -->
  <g fill="#00BFFF" filter="url(#glow)">
    <circle cx="160" cy="110" r="3"/>
    <circle cx="170" cy="200" r="3"/>
    <circle cx="180" cy="240" r="3"/>
    <circle cx="620" cy="95" r="3"/>
    <circle cx="640" cy="50" r="3"/>
    <circle cx="650" cy="190" r="3"/>
    <circle cx="630" cy="230" r="3"/>
    <circle cx="730" cy="70" r="3"/>
    <circle cx="730" cy="50" r="3"/>
    <circle cx="730" cy="230" r="3"/>
  </g>

  <!-- ═══ NAME & TAGLINE ═══ -->
  <text x="1160" y="238" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" fill="#4da6ff" text-anchor="end" letter-spacing="3" opacity="0.7">NYANDAJR · ML ENGINEER · DAR ES SALAAM</text>

  <!-- Animated pulse on centre chip -->
  <circle cx="450" cy="105" r="4" fill="none" stroke="#00BFFF" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;18;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
