  <line x1="700" y1="52" x2="688" y2="52" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="770" y1="28" x2="782" y2="28" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="770" y1="40" x2="782" y2="40" stroke="#0d3055" stroke-width="1.5"/>

