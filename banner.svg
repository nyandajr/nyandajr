  <line x1="398" y1="44" x2="398" y2="30" stroke="#0d3055" stroke-width="2"/>
  <line x1="416" y1="44" x2="416" y2="30" stroke="#0d3055" stroke-width="2"/>
  <line x1="434" y1="44" x2="434" y2="30" stroke="#0d3055" stroke-width="2"/>
  <line x1="452" y1="44" x2="452" y2="30" stroke="#0d3055" stroke-width="2"/>
  <!-- legs bottom -->
  <line x1="362" y1="146" x2="362" y2="165" stroke="#0d3055" stroke-width="2"/>
  <line x1="380" y1="146" x2="380" y2="165" stroke="#0d3055" stroke-width="2"/>
  <line x1="398" y1="146" x2="398" y2="165" stroke="#0d3055" stroke-width="2"/>
  <line x1="416" y1="146" x2="416" y2="165" stroke="#0d3055" stroke-width="2"/>
  <line x1="452" y1="146" x2="452" y2="165" stroke="#0d3055" stroke-width="2"/>
  <!-- legs left -->
