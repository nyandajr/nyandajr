  <line x1="344" y1="95"  x2="324" y2="95"  stroke="#0d3055" stroke-width="2"/>
  <line x1="344" y1="112" x2="324" y2="112" stroke="#0d3055" stroke-width="2"/>
  <line x1="344" y1="128" x2="324" y2="128" stroke="#0d3055" stroke-width="2"/>
  <!-- legs right -->
  <line x1="484" y1="62"  x2="504" y2="62"  stroke="#0d3055" stroke-width="2"/>
  <line x1="484" y1="78"  x2="504" y2="78"  stroke="#0d3055" stroke-width="2"/>
  <line x1="484" y1="95"  x2="504" y2="95"  stroke="#0d3055" stroke-width="2"/>
  <line x1="484" y1="112" x2="504" y2="112" stroke="#0d3055" stroke-width="2"/>
