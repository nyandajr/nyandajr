  <line x1="554" y1="155" x2="542" y2="155" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="554" y1="167" x2="542" y2="167" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="644" y1="155" x2="656" y2="155" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="644" y1="167" x2="656" y2="167" stroke="#0d3055" stroke-width="1.5"/>

