  <line x1="700" y1="124" x2="688" y2="124" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="770" y1="100" x2="782" y2="100" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="770" y1="112" x2="782" y2="112" stroke="#0d3055" stroke-width="1.5"/>

  <!-- Chip: LightGBM -->
  <rect x="554" y="145" width="90" height="42" rx="3" fill="#030a14" stroke="#0d3055" stroke-width="1"/>
