  <text x="593" y="45" text-anchor="middle" fill="#00bfff" font-size="9" font-family="monospace">FASTAPI</text>
  <line x1="554" y1="28" x2="542" y2="28" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="554" y1="40" x2="542" y2="40" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="554" y1="52" x2="542" y2="52" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="632" y1="28" x2="644" y2="28" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="632" y1="40" x2="644" y2="40" stroke="#0d3055" stroke-width="1.5"/>
  <line x1="632" y1="52" x2="644" y2="52" stroke="#0d3055" stroke-width="1.5"/>

