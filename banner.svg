  <circle cx="100"  cy="50"  r="2.5" fill="#00bfff" opacity="0.5"/>
  <circle cx="324"  cy="95"  r="2.5" fill="#00bfff" opacity="0.6"/>
  <circle cx="504"  cy="95"  r="2.5" fill="#00bfff" opacity="0.6"/>
  <circle cx="542"  cy="40"  r="2.5" fill="#4da6ff" opacity="0.5"/>
  <circle cx="688"  cy="40"  r="2.5" fill="#4da6ff" opacity="0.45"/>
  <circle cx="688"  cy="112" r="2.5" fill="#4da6ff" opacity="0.4"/>

  <!-- ANIMATED SIGNALS -->
  <!-- SQL → MLOps -->
  <circle r="4" fill="#00bfff">
    <animateMotion dur="2.6s" repeatCount="indefinite"
      path="M74,46 L100,46 L100,95 L324,95"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Python → MLOps -->
  <circle r="3.5" fill="#4da6ff">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.6s"
      path="M226,95 L324,95"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- PySpark → MLOps -->
  <circle r="3" fill="#7dd8f8">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.1s"
      path="M226,155 L270,155 L270,128 L324,128"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="1.1s"/>
  </circle>

  <!-- FastAPI → MLOps -->
  <circle r="3.5" fill="#00bfff">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.3s"
      path="M542,40 L504,40 L504,78"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- MLOps → Azure -->
  <circle r="3" fill="#00bfff">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.4s"
      path="M504,62 L680,62 L680,40 L700,40"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite" begin="1.4s"/>
  </circle>

  <!-- MLOps → Docker -->
  <circle r="3" fill="#4da6ff">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="0.8s"
      path="M504,112 L688,112 L700,112"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- LightGBM → MLOps -->
  <circle r="2.5" fill="#7dd8f8">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="2s"
      path="M542,160 L504,160 L504,128"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- upward pulse -->
  <circle r="2.5" fill="#00bfff" opacity="0.6">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="0.5s"
      path="M414,44 L414,16"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
